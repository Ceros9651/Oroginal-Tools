<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Original Timer - 区間タイマー</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Original Timer</h1>
      <p class="app-subtitle">作業と休憩の区間を自由に組み合わせるタイマー</p>
    </header>

    <main class="app-main">
      <!-- 区間リスト編集エリア -->
      <section class="editor-area" aria-label="区間リスト編集エリア">
        <h2>区間リスト</h2>
        <!-- 追加フォーム・区間リスト UI はタスク2で実装する -->
      </section>

      <!-- タイマー実行エリア -->
      <section class="runner-area" aria-label="タイマー実行エリア">
        <h2>タイマー</h2>
        <!-- 残り時間・現在種別・操作ボタンはタスク3で実装する -->
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
